[project]
name = "sonda"
version = "0.1.0"
description = "Verificações HTTP e histórico de incidentes"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi==0.143.0",
  "pydantic==2.14.1",
  "psycopg[binary]==3.3.6",
  "aiohttp==3.14.5",
  "uvicorn==0.54.0",
  "certifi==2026.7.22",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["sonda", "scripts"]

[tool.vercel]
entrypoint = "sonda.main:app"

[tool.vercel.scripts]
build = "npm --prefix frontend ci && npm --prefix frontend run build"

[tool.vercel.fastapi.static]
cdn = true

[tool.uv]
constraint-dependencies = [
  "aiohappyeyeballs==2.7.1",
  "aiohttp==3.14.5",
  "aiosignal==1.4.0",
  "annotated-doc==0.0.5",
  "annotated-types==0.8.0",
  "anyio==4.15.1",
  "attrs==26.1.0",
  "certifi==2026.7.22",
  "click==8.5.0",
  "fastapi==0.143.0",
  "frozenlist==1.8.0",
  "h11==0.16.0",
  "idna==3.20",
  "multidict==7.1.0",
  "opentelemetry-api==1.45.1",
  "propcache==0.5.4",
  "psycopg-binary==3.3.6",
  "psycopg==3.3.6",
  "pydantic_core==2.50.1",
  "pydantic==2.14.1",
  "starlette==1.8.0",
  "typing_extensions==4.16.0",
  "typing-inspection==0.4.4",
  "tzdata==2026.5",
  "uvicorn==0.54.0",
  "yarl==1.25.1",
]
